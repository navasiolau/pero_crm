# Опциональный overlay. Сам по себе не включает раздел и не меняет данные.
# docker compose -f docker-compose.server.yml -f docker-compose.kp.yml --profile kp ...
services:
  web:
    environment:
      PERO_KP_RENDERER_URL: http://kp-renderer:3100
      PERO_KP_RENDERER_SECRET: ${PERO_KP_RENDERER_SECRET}
      PERO_KP_PDF_SPOOL_ROOT: /tmp
    networks:
      - frontend
      - backend
      - kp_render
  kp-renderer:
    profiles: [kp]
    # Только discovery; watcher всегда подставляет digest из проверенного web OCI.
    image: ghcr.io/navasiolau/pero_kp_renderer:${CRM_IMAGE_TAG:-main}
    restart: unless-stopped
    init: true
    environment:
      PERO_KP_RENDERER_SECRET: ${PERO_KP_RENDERER_SECRET}
      PERO_KP_SPOOL_DIR: /spool
    read_only: true
    tmpfs:
      # Sparticuz извлекает исполняемый Chromium в этот ограниченный tmpfs.
      - /tmp:rw,nosuid,exec,size=512m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # PDF и изображения хранятся во временном дисковом томе, а не в памяти.
    volumes:
      - kp_render_spool:/spool
    # При исчерпании физических ресурсов первым завершается renderer, а не БД CRM.
    oom_score_adj: 1000
    networks:
      - kp_render
networks:
  kp_render:
    internal: true
volumes:
  kp_render_spool:
