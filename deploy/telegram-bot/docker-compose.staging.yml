# Telegram-бот STAGING (LXC tgbot, CT110 192.168.0.34)
# Стейджинг-CRM: http://192.168.0.30, образ staging. Health отдельно от prod.
services:
  bot-staging:
    image: ghcr.io/navasiolau/pero_telegram_bot:${BOT_IMAGE_TAG:-staging}
    container_name: tgbot-staging
    env_file: .env.staging
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "try{const h=JSON.parse(require('fs').readFileSync('/tmp/pero-telegram-bot-health-staging.json','utf8'));const fresh=x=>{const a=Date.now()-Date.parse(x);return Number.isFinite(a)&&a>=0&&a<=90000};if(h.schemaVersion!==1||h.service!=='telegram-bot'||h.status!=='healthy'||!fresh(h.generatedAt)||!['polling','crm'].every(k=>h[k].failureReason===null&&fresh(h[k].lastSuccessAt)))process.exit(1)}catch{process.exit(1)}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
