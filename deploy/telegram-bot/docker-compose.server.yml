# Telegram-бот PERO CRM — изолированный контейнер (LXC tgbot).
# Образ собирается CI (ghcr.io/navasiolau/pero_telegram_bot:<ветка>),
# контейнер сам тянет watcher-кроном — та же pull-модель, что у CRM.
services:
  bot:
    image: ghcr.io/navasiolau/pero_telegram_bot:${BOT_IMAGE_TAG:-main}
    container_name: tgbot
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "try{const h=JSON.parse(require('fs').readFileSync('/tmp/pero-telegram-bot-health.json','utf8'));const fresh=x=>{const a=Date.now()-Date.parse(x);return Number.isFinite(a)&&a>=0&&a<=90000};if(h.schemaVersion!==1||h.service!=='telegram-bot'||h.status!=='healthy'||!fresh(h.generatedAt)||!['polling','crm'].every(k=>h[k].failureReason===null&&fresh(h[k].lastSuccessAt)))process.exit(1)}catch{process.exit(1)}"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
