services:
  postgres:
    image: postgres:16-alpine
    container_name: pero_crm_pg
    restart: unless-stopped
    environment:
      POSTGRES_DB: pero_crm
      POSTGRES_USER: pero
      POSTGRES_PASSWORD: pero_crm_dev
    ports:
      # Порт 5433: 5432 занят postgres проекта экспорта legacy CRM (D:\legacy_export)
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pero -d pero_crm"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: pero_crm_app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://pero:pero_crm_dev@postgres:5432/pero_crm
      # Начисления/таймеры/месяцы ЗП считаются по локальному времени
      TZ: ${TZ:-Europe/Minsk}
    volumes:
      # Файловое хранилище (§13): uploads/<projectId>/… — переживает
      # пересборку образа; в контейнере process.cwd() = /app
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["prod"]

  caddy:
    image: caddy:2-alpine
    container_name: pero_crm_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:-localhost}
    depends_on:
      - app
    profiles: ["prod"]

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
