packages:
  - "apps/*"
  - "packages/*"
  - "packages/plugins/*"

# Postinstall-скрипты разрешены только этим пакетам (pnpm 11: ключ
# allowBuilds со значениями boolean; pnpm approve-builds пишет сюда же)
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true
