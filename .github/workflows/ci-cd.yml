name: CI/CD

# Модель деплоя (решение 09.2026): сборка образа в облаке, публикация в GHCR,
# серверы сами забирают образ watcher-кроном (исходящий трафик, NAT не мешает).
# Тег образа = имя ветки (main, staging) + sha-тег для отката.
# Публикация разрешена только после успеха всех unit и native проверок.

on:
  push:
    branches: [main, staging]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        cohort: [backend, components-0, components-1]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: matrix.cohort == 'backend'
        with:
          python-version: '3.12'

      - name: Тесты безопасного автодеплоя (без Docker и БД)
        if: matrix.cohort == 'backend'
        run: python -m unittest discover -s deploy/tests -v

      - uses: pnpm/action-setup@v4
        # версия берётся из packageManager в package.json (pnpm@11)

      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: 22
          cache: pnpm

      - name: Зависимости
        run: pnpm install --frozen-lockfile

      # pnpm 11 не запускает postinstall-генерацию Prisma Client в CI —
      # без него tsc сыпется на всех типах @prisma/client
      - name: Prisma Client (generate)
        run: pnpm --filter @pero/web exec prisma generate

      - name: Lint
        if: matrix.cohort == 'backend'
        run: pnpm lint

      - name: Версия Playwright для browser cache
        id: playwright
        if: matrix.cohort != 'backend'
        working-directory: apps/web
        run: node -e "console.log('version='+require('@playwright/test/package.json').version)" >> "$GITHUB_OUTPUT"

      - name: Совместимый Chromium cache
        if: matrix.cohort != 'backend'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Chromium и системные зависимости компонентных тестов
        if: matrix.cohort != 'backend'
        run: pnpm --filter @pero/web exec playwright install --with-deps chromium

      - name: Тесты приложений
        run: |
          # Каждый файл прежних web globs исполняется ровно в одной cohort.
          files=()
          for file in apps/web/tests/*.test.ts apps/web/tests/*.test.mjs; do
            case "${file##*/}" in
              default-cash-account-component.test.mjs|default-cash-forms-component.test.mjs|global-kanban-current-engineer-component.test.mjs|income-form-component.test.mjs|kanban-render-isolation.test.mjs|product-card-navigation-browser.test.mjs|product-kanban-search-readiness.test.mjs|project-filter-component.test.mjs|stock-movement-component.test.mjs|warehouse-units-component.test.mjs)
                cohort=components-0 ;;
              client-passport-component.test.mjs|counterparty-component.test.mjs|file-list-printing.test.ts|inline-field-subscriptions.test.mjs|project-client-contact-component.test.mjs|project-product-create-dialog.test.mjs|warehouse-deletion-component.test.mjs|task-status-command.browser.test.ts)
                cohort=components-1 ;;
              *) cohort=backend ;;
            esac
            if [ "$cohort" = "$COHORT" ]; then files+=("${file#apps/web/}"); fi
          done
          test "${#files[@]}" -gt 0
          if [ "$COHORT" = backend ]; then
            pnpm -r --if-present --filter '!@pero/web' test
          fi
          pnpm --filter @pero/web exec tsx --test "${files[@]}"
        env:
          COHORT: ${{ matrix.cohort }}

      - name: Получить проверенные свежие types текущего OCI
        if: matrix.cohort == 'backend'
        run: |
          node --input-type=module <<'NODE'
          import { cpSync, existsSync } from 'node:fs';
          import { receiveCiArtifact, requireCi, verifyTypesArtifact } from './apps/web/tests/integration/runtime/target.mjs';
          const { directory } = await receiveCiArtifact('types');
          const manifest = verifyTypesArtifact(directory);
          requireCi(!existsSync('apps/web/.next/BUILD_ID') && !existsSync('apps/web/.next/types'), 'backend-fresh-types');
          cpSync(`${directory}/metadata`, 'apps/web/.next', { recursive: true });
          console.log(JSON.stringify({ ciRuntime: 'types-ready', buildId: manifest.buildId, indexDigest: manifest.indexDigest }));
          NODE
        env:
          CI_ARTIFACT_TOKEN: ${{ github.token }}
          CI_WORKFLOW_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: TypeScript incremental cache
        if: matrix.cohort == 'backend'
        uses: actions/cache@v4
        with:
          path: apps/web/tsconfig.tsbuildinfo
          key: types-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'apps/web/package.json', 'apps/web/tsconfig.json', 'apps/web/next.config.ts', 'packages/*/package.json', 'packages/plugins/*/package.json', 'packages/*/tsconfig.json', 'packages/plugins/*/tsconfig.json') }}-${{ hashFiles('apps/web/src/**', 'apps/web/tests/**', 'apps/web/*.ts', 'apps/web/prisma/schema.prisma', 'packages/*/src/**', 'packages/plugins/*/src/**') }}
          restore-keys: |
            types-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'apps/web/package.json', 'apps/web/tsconfig.json', 'apps/web/next.config.ts', 'packages/*/package.json', 'packages/plugins/*/package.json', 'packages/*/tsconfig.json', 'packages/plugins/*/tsconfig.json') }}-

      - name: Полная типизация web после свежего build
        if: matrix.cohort == 'backend'
        run: |
          started=$SECONDS
          status=0
          pnpm --filter @pero/web exec tsc --noEmit || status=$?
          printf 'Full web tsc: %ss; exit: %s\n' "$((SECONDS-started))" "$status"
          exit "$status"

      - name: Закрепить проверенный plain JS бота
        if: matrix.cohort == 'backend'
        run: |
          node --input-type=module <<'NODE'
          import { cpSync, mkdirSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import path from 'node:path';
          import { botDistDigest } from './apps/web/tests/integration/runtime/target.mjs';
          const env = process.env, directory = path.join(env.RUNNER_TEMP, 'pero-bot-dist');
          if (execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim() !== env.GITHUB_SHA) throw Error('BOT_REVISION_REFUSED');
          const files = botDistDigest('apps/telegram-bot/dist');
          mkdirSync(directory); cpSync('apps/telegram-bot/dist', path.join(directory, 'dist'), { recursive: true });
          writeFileSync(path.join(directory, 'tested.json'), JSON.stringify({ revision: env.GITHUB_SHA,
            runId: env.GITHUB_RUN_ID, attempt: env.GITHUB_RUN_ATTEMPT, files }));
          NODE

      - uses: actions/upload-artifact@v4
        if: matrix.cohort == 'backend'
        with:
          name: bot-dist-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/pero-bot-dist
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # Build и native используют один свежий checkout/runtime без повторного install.
  native-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    outputs:
      oci-sha256: ${{ steps.next-build.outputs.oci-sha256 }}
      index-digest: ${{ steps.next-build.outputs.index-digest }}
      bot-oci-sha256: ${{ steps.bot-record.outputs.oci-sha256 }}
      bot-index-digest: ${{ steps.bot-record.outputs.index-digest }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pero_ci
          POSTGRES_USER: ci_runner
          POSTGRES_PASSWORD: ci-only-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,nosuid,size=512m
          --label pero.ci.repository=navasiolau/pero_crm
          --label pero.ci.run=${{ github.run_id }}
          --label pero.ci.attempt=${{ github.run_attempt }}
          --label pero.ci.service=postgres
          --health-cmd "pg_isready -U ci_runner -d pero_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://ci_runner:ci-only-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:55432/pero_ci?schema=public
      CRM_FILE_STORAGE: s3
      S3_ENDPOINT: http://127.0.0.1:59000
      S3_BUCKET: ci-${{ github.run_id }}-${{ github.run_attempt }}
      S3_ACCESS_KEY: ci_runner
      S3_SECRET_KEY: ci-only-${{ github.run_id }}-${{ github.run_attempt }}-s3
      S3_REGION: us-east-1
      AUTH_SECRET: ci-only-${{ github.run_id }}-${{ github.run_attempt }}-auth
      AUTH_URL: http://127.0.0.1:3100
      AUTH_TRUST_HOST: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: 22
          cache: pnpm

      - name: Фоновая принадлежащая job установка dependencies
        run: |
          node --input-type=module <<'NODE'
          import { assertCiJob } from './apps/web/tests/integration/runtime/target.mjs';
          import { startDependencies } from './apps/web/tests/integration/runtime/cleanup.mjs';
          startDependencies(assertCiJob());
          NODE
        env:
          PERO_CI_POSTGRES_ID: ${{ job.services.postgres.id }}
          PERO_CI_NETWORK: ${{ job.services.postgres.network }}

      - uses: docker/setup-buildx-action@v3
        id: builder

      - name: Подготовить один OCI build и совместимый compiler cache
        id: prepare
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { appendFileSync, mkdirSync, readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import path from 'node:path';
          import { assertCiJob, requireCi } from './apps/web/tests/integration/runtime/target.mjs';
          const job = assertCiJob(), env = process.env;
          requireCi(execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim() === env.GITHUB_SHA, 'checkout-revision');
          const base = execFileSync('docker', ['buildx', 'imagetools', 'inspect', 'node:22-alpine', '--format', '{{json .Manifest}}'], { encoding: 'utf8' });
          const baseDigest = JSON.parse(base).digest;
          requireCi(/^sha256:[a-f0-9]{64}$/.test(baseDigest), 'node-base-digest');
          const nodeImage = `node:22-alpine@${baseDigest}`;
          const dockerStages = readFileSync('apps/web/Dockerfile', 'utf8').replace(/\r\n?/g, '\n').split(/^FROM base AS runner\s*$/m);
          requireCi(dockerStages.length === 2 && /^[a-f0-9]{64}$/.test(env.BUILD_CONFIG), 'compiler-build-prefix');
          const platform = 'linux/amd64', buildFlags = { GITHUB_ACTIONS: 'true', PERO_CI_EXTERNAL_CHECKS: '1' };
          const compat = createHash('sha256').update(JSON.stringify({ version: 2, buildPrefix: dockerStages[0],
            config: env.BUILD_CONFIG, baseDigest, platform, buildFlags })).digest('hex');
          const cacheId = `pero-next-musl-v2-${compat}`;
          const directory = path.join(env.RUNNER_TEMP, `pero-web-${job.runId}-${job.attempt}-${env.GITHUB_SHA}`);
          mkdirSync(directory); mkdirSync('apps/web/.next/cache', { recursive: true });
          const labels = { 'org.opencontainers.image.revision': env.GITHUB_SHA, 'pero.ci.repository': env.GITHUB_REPOSITORY,
            'pero.ci.run': job.runId, 'pero.ci.attempt': job.attempt, 'pero.ci.service': 'web' };
          const common = { context: '.', dockerfile: 'apps/web/Dockerfile', target: 'runner', platforms: [platform], labels,
            args: { NODE_IMAGE: nodeImage, ...buildFlags, PERO_CI_CACHE_ID: cacheId },
            tags: [job.webImage], 'cache-from': ['type=gha,scope=pero-web'] };
          const cacheMount = `type=cache,id=${cacheId},target=/app/apps/web/.next/cache,sharing=locked`;
          const bake = { group: { default: { targets: ['web-oci', 'web-runtime', 'minio'] } }, target: {
            'web-oci': { ...common, attest: ['type=provenance,mode=max'],
              'cache-to': ['type=gha,mode=max,scope=pero-web'], output: [`type=oci,dest=${directory}/web.oci.tar`] },
            'web-runtime': { ...common, attest: ['type=provenance,disabled=true'], output: ['type=docker'] },
            minio: { context: 'apps/web/tests/integration/runtime', dockerfile: 'Dockerfile.minio', platforms: ['linux/amd64'],
              attest: ['type=provenance,disabled=true'], tags: [job.minioImage],
              labels: { ...labels, 'pero.ci.service': 'minio', 'pero.ci.minio.commit': '07c3a429bfed433e49018cb0f78a52145d4bedeb' },
              'cache-from': ['type=gha,scope=pero-ci-minio'], 'cache-to': ['type=gha,mode=max,scope=pero-ci-minio'],
              output: ['type=docker'] },
            'cache-inject': { context: '.', contexts: { incoming: './apps/web/.next/cache' },
              'dockerfile-inline': `FROM ${nodeImage}\nRUN --mount=${cacheMount} --mount=type=bind,from=incoming,target=/incoming cp -a /incoming/. /app/apps/web/.next/cache/`,
              output: ['type=cacheonly'] },
            'cache-extract': { context: '.',
              'dockerfile-inline': `FROM ${nodeImage} AS extract\nRUN --mount=${cacheMount} mkdir /result && cp -a /app/apps/web/.next/cache/. /result/\nFROM scratch\nCOPY --from=extract /result /`,
              output: ['type=local,dest=./apps/web/.next/cache'] },
          }};
          writeFileSync(path.join(directory, 'bake.json'), JSON.stringify(bake));
          appendFileSync(env.GITHUB_OUTPUT, `directory=${directory}\ncompat=${compat}\n`);
          appendFileSync(env.GITHUB_ENV, `PERO_CI_WEB_ARTIFACT_DIR=${directory}\n`);
          NODE
        env:
          BUILD_CONFIG: ${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'apps/web/package.json', 'apps/web/*config.*', 'packages/*/package.json', 'packages/plugins/*/package.json', 'packages/*/tsconfig.json', 'packages/plugins/*/tsconfig.json') }}
          PERO_CI_POSTGRES_ID: ${{ job.services.postgres.id }}
          PERO_CI_NETWORK: ${{ job.services.postgres.network }}

      - name: Alpine Next compiler cache
        id: compiler-cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-oci-musl-v2-${{ steps.prepare.outputs.compat }}-${{ hashFiles('apps/web/src/**', 'apps/web/public/**', 'apps/web/prisma/**', 'packages/*/src/**', 'packages/plugins/*/src/**') }}
          restore-keys: |
            next-oci-musl-v2-${{ steps.prepare.outputs.compat }}-

      - name: Восстановить compiler cache mount
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          source: .
          builder: ${{ steps.builder.outputs.name }}
          files: ${{ steps.prepare.outputs.directory }}/bake.json
          targets: cache-inject
          provenance: false

      - name: Один production OCI и закреплённый MinIO
        id: images
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          source: .
          builder: ${{ steps.builder.outputs.name }}
          files: ${{ steps.prepare.outputs.directory }}/bake.json
          targets: web-oci,web-runtime,minio
          allow: fs.write=${{ steps.prepare.outputs.directory }}

      - name: Сохранить compiler cache mount
        if: always() && steps.prepare.outcome == 'success' && steps.compiler-cache.outputs.cache-hit != 'true'
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          source: .
          builder: ${{ steps.builder.outputs.name }}
          files: ${{ steps.prepare.outputs.directory }}/bake.json
          targets: cache-extract
          provenance: false

      - name: Проверить OCI и загрузить точную runtime projection
        id: next-build
        run: |
          test ! -f apps/web/.next/BUILD_ID
          mkdir "$PERO_CI_WEB_ARTIFACT_DIR/oci"
          tar -xf "$PERO_CI_WEB_ARTIFACT_DIR/web.oci.tar" --directory "$PERO_CI_WEB_ARTIFACT_DIR/oci" --no-same-owner
          node --input-type=module <<'NODE'
          import { appendFileSync, cpSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { artifactIdentity, assertCiJob, readWebArtifact, requireCi, typesDigest } from './apps/web/tests/integration/runtime/target.mjs';
          import { extractWebMetadata } from './apps/web/tests/integration/runtime/containers.mjs';
          const env = process.env, job = assertCiJob(), metadata = JSON.parse(env.BUILD_METADATA);
          const web = extractWebMetadata(job, metadata['web-runtime']['containerimage.config.digest']);
          const record = await readWebArtifact(false);
          requireCi(metadata['web-oci']['containerimage.digest'] === record.indexDigest, 'bake-oci-digest');
          const inspect = tag => JSON.parse(execFileSync('docker', ['image', 'inspect', tag], { encoding: 'utf8' }))[0];
          const minio = inspect(job.minioImage);
          requireCi(web.Id === record.configDigest && JSON.stringify(web.RootFS.Layers) === JSON.stringify(record.diffIds), 'docker-oci-projection');
          writeFileSync(`${env.PERO_CI_WEB_ARTIFACT_DIR}/image.json`, JSON.stringify(record));
          cpSync(`${env.PERO_CI_WEB_ARTIFACT_DIR}/metadata`, 'apps/web/.next', { recursive: true });
          const payload = `${env.PERO_CI_WEB_ARTIFACT_DIR}/types-artifact`;
          cpSync(`${env.PERO_CI_WEB_ARTIFACT_DIR}/metadata`, `${payload}/metadata`, { recursive: true });
          writeFileSync(`${payload}/types.json`, JSON.stringify({ ...artifactIdentity(), buildId: record.buildId,
            indexDigest: record.indexDigest, configDigest: record.configDigest, files: typesDigest(`${payload}/metadata`) }));
          appendFileSync(env.GITHUB_OUTPUT, `revision=${record.revision}\nbuild-id=${record.buildId}\noci-sha256=${record.ociSha256}\nindex-digest=${record.indexDigest}\n`);
          appendFileSync(env.GITHUB_ENV, `PERO_CI_WEB_IMAGE_ID=${web.Id}\nPERO_CI_MINIO_IMAGE_ID=${minio.Id}\nPERO_CI_EXPECTED_OCI_SHA256=${record.ociSha256}\n`);
          console.log(JSON.stringify({ ciRuntime: 'next-build-ready', ...record, node: process.version, platform: process.platform, arch: process.arch }));
          NODE
        env:
          BUILD_METADATA: ${{ steps.images.outputs.metadata }}
          PERO_CI_POSTGRES_ID: ${{ job.services.postgres.id }}
          PERO_CI_NETWORK: ${{ job.services.postgres.network }}

      - name: Свежие types из проверенного OCI
        uses: actions/upload-artifact@v4
        with:
          name: types-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ steps.prepare.outputs.directory }}/types-artifact
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Подтвердить завершение host dependencies и PostgreSQL
        run: |
          node --input-type=module <<'NODE'
          import { assertCiJob } from './apps/web/tests/integration/runtime/target.mjs';
          import { waitDependencies } from './apps/web/tests/integration/runtime/cleanup.mjs';
          await waitDependencies(assertCiJob());
          NODE
        env:
          PERO_CI_POSTGRES_ID: ${{ job.services.postgres.id }}
          PERO_CI_NETWORK: ${{ job.services.postgres.network }}

      - name: Интеграционные PostgreSQL + HTTP/S3 контракты
        run: |
          started=$SECONDS
          status=0
          pnpm --filter @pero/web exec node tests/integration/runtime/run.mjs http || status=$?
          printf 'Native contracts: %ss; exit: %s\n' "$((SECONDS-started))" "$status"
          exit "$status"
        env:
          PERO_CI_BUILD_REVISION: ${{ steps.next-build.outputs.revision }}
          PERO_CI_BUILD_ID: ${{ steps.next-build.outputs.build-id }}
          PERO_CI_POSTGRES_ID: ${{ job.services.postgres.id }}
          PERO_CI_NETWORK: ${{ job.services.postgres.network }}

      - name: Удалить временный MinIO и завершить web
        if: always()
        run: node apps/web/tests/integration/runtime/cleanup.mjs
        env:
          PERO_CI_POSTGRES_ID: ${{ job.services.postgres.id }}
          PERO_CI_NETWORK: ${{ job.services.postgres.network }}
        # PostgreSQL и job network удаляет штатный GitHub Stop containers;
        # данные обоих сервисов в tmpfs, постоянные тома не создаются.

      - name: Дождаться проверенного backend artifact текущего запуска
        if: github.event_name == 'push'
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, mkdirSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          import { assertCiJob, receiveCiArtifact } from './apps/web/tests/integration/runtime/target.mjs';
          const job = assertCiJob(), env = process.env;
          const { directory: source, producer } = await receiveCiArtifact('bot-dist');
          const directory = path.join(env.RUNNER_TEMP, `pero-bot-${job.runId}-${job.attempt}-${env.GITHUB_SHA}`);
          mkdirSync(directory); mkdirSync(path.join(directory, 'metadata'));
          writeFileSync(path.join(directory, 'metadata', 'producer.json'), JSON.stringify(producer));
          appendFileSync(env.GITHUB_ENV, `PERO_CI_BOT_ARTIFACT_DIR=${directory}\nPERO_CI_BOT_DIST_DIR=${source}\n`);
          NODE
        env:
          CI_ARTIFACT_TOKEN: ${{ github.token }}
          PERO_CI_POSTGRES_ID: ${{ job.services.postgres.id }}
          PERO_CI_NETWORK: ${{ job.services.postgres.network }}

      - name: Подготовить bot OCI из проверенных plain JS байтов
        if: github.event_name == 'push'
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { cpSync, readFileSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          import { botDistDigest, requireCi, REPOSITORY } from './apps/web/tests/integration/runtime/target.mjs';
          const env = process.env, source = env.PERO_CI_BOT_DIST_DIR, directory = env.PERO_CI_BOT_ARTIFACT_DIR;
          const tested = JSON.parse(readFileSync(path.join(source, 'tested.json'), 'utf8'));
          requireCi(tested.revision === env.GITHUB_SHA && tested.runId === env.GITHUB_RUN_ID &&
            tested.attempt === env.GITHUB_RUN_ATTEMPT, 'bot-tested-owner');
          const files = botDistDigest(path.join(source, 'dist'));
          requireCi(JSON.stringify(files) === JSON.stringify(tested.files), 'bot-tested-bytes');
          cpSync(path.join(source, 'tested.json'), path.join(directory, 'metadata', 'tested.json'));
          const digest = file => `sha256:${createHash('sha256').update(readFileSync(file)).digest('hex')}`;
          const bakeFile = path.join(env.PERO_CI_WEB_ARTIFACT_DIR, 'bake.json'), bake = JSON.parse(readFileSync(bakeFile, 'utf8'));
          bake.target['bot-oci'] = { context: '.', dockerfile: 'apps/telegram-bot/Dockerfile', target: 'ci-runner',
            contexts: { 'pero-bot-dist': source }, platforms: ['linux/amd64'], attest: ['type=provenance,mode=max'],
            labels: { 'org.opencontainers.image.revision': env.GITHUB_SHA, 'pero.ci.repository': REPOSITORY,
              'pero.ci.run': env.GITHUB_RUN_ID, 'pero.ci.attempt': env.GITHUB_RUN_ATTEMPT, 'pero.ci.service': 'bot',
              'pero.ci.tested-dist': digest(path.join(directory, 'metadata', 'tested.json')),
              'pero.ci.producer': digest(path.join(directory, 'metadata', 'producer.json')) },
            'cache-from': ['type=gha,scope=pero-telegram-bot'], 'cache-to': ['type=gha,mode=max,scope=pero-telegram-bot'],
            output: [`type=oci,dest=${directory}/bot.oci.tar`] };
          writeFileSync(bakeFile, JSON.stringify(bake));
          NODE

      - name: Упаковать bot OCI существующим Buildx без публикации
        if: github.event_name == 'push'
        id: bot-image
        uses: docker/bake-action@5be5f02ff8819ecd3092ea6b2e6261c31774f2b4 # v6
        env:
          DOCKER_BUILD_SUMMARY: false
          DOCKER_BUILD_RECORD_UPLOAD: false
        with:
          source: .
          builder: ${{ steps.builder.outputs.name }}
          files: ${{ steps.prepare.outputs.directory }}/bake.json
          targets: bot-oci
          allow: fs.write=${{ env.PERO_CI_BOT_ARTIFACT_DIR }}

      - name: Закрепить исходный bot OCI и provenance
        if: github.event_name == 'push'
        id: bot-record
        run: |
          mkdir "$PERO_CI_BOT_ARTIFACT_DIR/oci"
          tar -xf "$PERO_CI_BOT_ARTIFACT_DIR/bot.oci.tar" --directory "$PERO_CI_BOT_ARTIFACT_DIR/oci" --no-same-owner
          node --input-type=module <<'NODE'
          import { appendFileSync, writeFileSync } from 'node:fs';
          import path from 'node:path';
          import { readWebArtifact, requireCi } from './apps/web/tests/integration/runtime/target.mjs';
          const env = process.env, record = await readWebArtifact(false, env, 'bot');
          requireCi(JSON.parse(env.BOT_BUILD_METADATA)['bot-oci']['containerimage.digest'] === record.indexDigest, 'bot-bake-digest');
          writeFileSync(path.join(env.PERO_CI_BOT_ARTIFACT_DIR, 'image.json'), JSON.stringify(record));
          appendFileSync(env.GITHUB_OUTPUT, `oci-sha256=${record.ociSha256}\nindex-digest=${record.indexDigest}\n`);
          console.log(JSON.stringify({ ciRuntime: 'bot-oci-packaged', ...record }));
          NODE
        env:
          BOT_BUILD_METADATA: ${{ steps.bot-image.outputs.metadata }}

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: bot-oci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            ${{ env.PERO_CI_BOT_ARTIFACT_DIR }}/bot.oci.tar
            ${{ env.PERO_CI_BOT_ARTIFACT_DIR }}/image.json
            ${{ env.PERO_CI_BOT_ARTIFACT_DIR }}/metadata/tested.json
            ${{ env.PERO_CI_BOT_ARTIFACT_DIR }}/metadata/producer.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - uses: actions/upload-artifact@v4
        with:
          name: web-oci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: |
            ${{ steps.prepare.outputs.directory }}/web.oci.tar
            ${{ steps.prepare.outputs.directory }}/image.json
            ${{ steps.prepare.outputs.directory }}/metadata/BUILD_ID
            ${{ steps.prepare.outputs.directory }}/metadata/server/server-reference-manifest.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # Прямой gate блокирует публикацию при failure/cancelled/skipped любой проверки.
  build-push:
    if: github.event_name == 'push' && needs.unit-tests.result == 'success' && needs.native-tests.result == 'success'
    needs: [unit-tests, native-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: web-oci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/pero-web-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}

      - name: Проверить и опубликовать испытанный OCI без пересборки
        run: &promote_original_oci |
          case "$PERO_CI_ARTIFACT_KIND" in
            web) directory="$PERO_CI_WEB_ARTIFACT_DIR"; expected="$PERO_CI_EXPECTED_OCI_SHA256" ;;
            bot) directory="$PERO_CI_BOT_ARTIFACT_DIR"; expected="$PERO_CI_EXPECTED_BOT_OCI_SHA256" ;;
            *) exit 1 ;;
          esac
          printf '%s  %s\n' "${expected#sha256:}" "$directory/$PERO_CI_ARTIFACT_KIND.oci.tar" | sha256sum --check
          mkdir "$directory/oci"
          tar -xf "$directory/$PERO_CI_ARTIFACT_KIND.oci.tar" --directory "$directory/oci" --no-same-owner
          curl --fail --silent --show-error --location https://github.com/regclient/regclient/releases/download/v0.11.6/regctl-linux-amd64 --output "$RUNNER_TEMP/regctl"
          printf '8e0e62a497fcdb8048d18aa927a139613176ba0531f412bc541044e28f9856bd  %s\n' "$RUNNER_TEMP/regctl" | sha256sum --check
          chmod +x "$RUNNER_TEMP/regctl"
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process';
          import { readWebArtifact, requireCi } from './apps/web/tests/integration/runtime/target.mjs';
          const env = process.env, kind = env.PERO_CI_ARTIFACT_KIND, record = await readWebArtifact(true, env, kind);
          requireCi(execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim() === record.revision &&
            record.indexDigest === env.PERO_CI_EXPECTED_INDEX_DIGEST, 'promotion-checkout');
          requireCi(env.GITHUB_EVENT_NAME === 'push' && ['staging', 'main'].includes(env.GITHUB_REF_NAME), 'promotion-branch');
          const cli = args => execFileSync(`${env.RUNNER_TEMP}/regctl`, args, { encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] }).trim();
          const directory = kind === 'web' ? env.PERO_CI_WEB_ARTIFACT_DIR : env.PERO_CI_BOT_ARTIFACT_DIR;
          const source = `ocidir://${directory}/oci@${record.indexDigest}`;
          const repository = kind === 'web' ? 'ghcr.io/navasiolau/pero_crm' : 'ghcr.io/navasiolau/pero_telegram_bot';
          cli(['image', 'copy', '--referrers', '--force-recursive', source, `${repository}:sha-${record.revision}`]);
          requireCi(cli(['image', 'digest', `${repository}:sha-${record.revision}`]) === record.indexDigest, 'promoted-index');
          // Равный digest сохраняет исходный OCI index вместе с attestation descriptors.
          cli(['image', 'copy', '--referrers', '--force-recursive', `${repository}@${record.indexDigest}`, `${repository}:${env.GITHUB_REF_NAME}`]);
          requireCi(cli(['image', 'digest', `${repository}:${env.GITHUB_REF_NAME}`]) === record.indexDigest, 'branch-index');
          const identity = kind === 'web' ? { buildId: record.buildId } :
            { testedDistManifestSha256: record.testedDistManifestSha256, producerJobId: record.producer.jobId };
          console.log(JSON.stringify({ ciRuntime: kind === 'web' ? 'tested-oci-promoted' : 'bot-oci-promoted',
            revision: record.revision, runId: record.runId, attempt: record.attempt, ...identity,
            indexDigest: record.indexDigest, attestations: record.attestations }));
          NODE
        env:
          PERO_CI_ARTIFACT_KIND: web
          PERO_CI_WEB_ARTIFACT_DIR: ${{ runner.temp }}/pero-web-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          PERO_CI_EXPECTED_OCI_SHA256: ${{ needs.native-tests.outputs.oci-sha256 }}
          PERO_CI_EXPECTED_INDEX_DIGEST: ${{ needs.native-tests.outputs.index-digest }}

  # Telegram-бот — изолированный сервис (LXC tgbot), свой образ,
  # та же pull-модель деплоя (watcher-крон на контейнере)
  build-push-bot:
    if: github.event_name == 'push' && needs.unit-tests.result == 'success' && needs.native-tests.result == 'success'
    needs: [unit-tests, native-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bot-oci-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: ${{ runner.temp }}/pero-bot-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Проверить и опубликовать исходный bot OCI без пересборки
        run: *promote_original_oci
        env:
          PERO_CI_ARTIFACT_KIND: bot
          PERO_CI_BOT_ARTIFACT_DIR: ${{ runner.temp }}/pero-bot-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          PERO_CI_EXPECTED_BOT_OCI_SHA256: ${{ needs.native-tests.outputs.bot-oci-sha256 }}
          PERO_CI_EXPECTED_INDEX_DIGEST: ${{ needs.native-tests.outputs.bot-index-digest }}
