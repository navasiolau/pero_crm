name: CI/CD

# Модель деплоя (решение 09.2026): сборка образа в облаке, публикация в GHCR,
# серверы сами забирают образ watcher-кроном (исходящий трафик, NAT не мешает).
# Тег образа = имя ветки (main, staging) + sha-тег для отката.
# Деплой возможен ТОЛЬКО при зелёных тестах (needs: test).

on:
  push:
    branches: [main, staging]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Тесты безопасного автодеплоя (без Docker и БД)
        run: python -m unittest discover -s deploy/tests -v

      - uses: pnpm/action-setup@v4
        # версия берётся из packageManager в package.json (pnpm@11)

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Зависимости
        run: pnpm install --frozen-lockfile

      # pnpm 11 не запускает postinstall-генерацию Prisma Client в CI —
      # без него tsc сыпется на всех типах @prisma/client
      - name: Prisma Client (generate)
        run: pnpm --filter @pero/web exec prisma generate

      - name: Chromium для компонентных тестов формы
        run: pnpm --filter @pero/web exec playwright install --with-deps chromium

      - name: Тесты приложений
        run: pnpm -r --if-present test

  build-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      node-version: ${{ steps.node.outputs.node-version }}
      next-artifact-name: ${{ steps.next-pack.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        id: node
        with:
          node-version: 22
          cache: pnpm

      - name: Зависимости
        run: pnpm install --frozen-lockfile

      - name: Prisma Client (generate)
        run: pnpm --filter @pero/web exec prisma generate

      - name: Next compiler cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'apps/web/package.json', 'apps/web/*config.*', 'packages/*/package.json', 'packages/plugins/*/package.json', 'packages/*/tsconfig.json', 'packages/plugins/*/tsconfig.json') }}-${{ hashFiles('apps/web/src/**', 'apps/web/public/**', 'apps/web/prisma/**', 'packages/*/src/**', 'packages/plugins/*/src/**') }}
          restore-keys: |
            next-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'apps/web/package.json', 'apps/web/*config.*', 'packages/*/package.json', 'packages/plugins/*/package.json', 'packages/*/tsconfig.json', 'packages/plugins/*/tsconfig.json') }}-

      - name: TypeScript incremental cache
        uses: actions/cache@v4
        with:
          path: apps/web/tsconfig.tsbuildinfo
          key: types-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'apps/web/package.json', 'apps/web/tsconfig.json', 'apps/web/next.config.ts', 'packages/*/package.json', 'packages/plugins/*/package.json', 'packages/*/tsconfig.json', 'packages/plugins/*/tsconfig.json') }}-${{ hashFiles('apps/web/src/**', 'apps/web/tests/**', 'apps/web/*.ts', 'apps/web/prisma/schema.prisma', 'packages/*/src/**', 'packages/plugins/*/src/**') }}
          restore-keys: |
            types-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'apps/web/package.json', 'apps/web/tsconfig.json', 'apps/web/next.config.ts', 'packages/*/package.json', 'packages/plugins/*/package.json', 'packages/*/tsconfig.json', 'packages/plugins/*/tsconfig.json') }}-

      - name: Lint
        run: pnpm lint

      - name: Сборка (Next.js production)
        run: pnpm build
        env:
          # Все исходники, включая *.test.ts и свежие route types, проверяются ниже.
          PERO_CI_EXTERNAL_CHECKS: '1'
          # Значения-заглушки — только для prerender, как в Dockerfile
          DATABASE_URL: postgresql://dummy:dummy@localhost:5432/dummy
          AUTH_SECRET: ci-dummy

      - name: Typecheck (backend + frontend + tests + fresh routes)
        run: pnpm --filter @pero/web exec tsc --noEmit

      - name: Typecheck (telegram-bot)
        run: pnpm --filter @pero/telegram-bot exec tsc --noEmit

      - name: Подготовить свежую Next-сборку для native job
        id: next-pack
        run: |
          tar --exclude=.next/cache --exclude=.next/standalone -czf "$RUNNER_TEMP/next-output.tar.gz" -C apps/web .next public
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import path from 'node:path';
          const env = process.env;
          const revision = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          if (revision !== env.GITHUB_SHA) throw Error('CI_BUILD_REVISION_REFUSED');
          const provenance = { repository: env.GITHUB_REPOSITORY, revision,
            runId: env.GITHUB_RUN_ID, attempt: env.GITHUB_RUN_ATTEMPT,
            node: process.version, platform: process.platform, arch: process.arch,
            runnerOS: env.RUNNER_OS, imageOS: env.ImageOS,
            buildId: readFileSync('apps/web/.next/BUILD_ID', 'utf8').trim(),
            sha256: createHash('sha256').update(readFileSync(path.join(env.RUNNER_TEMP, 'next-output.tar.gz'))).digest('hex') };
          writeFileSync(path.join(env.RUNNER_TEMP, 'next-provenance.json'), JSON.stringify(provenance));
          appendFileSync(env.GITHUB_OUTPUT, `name=next-${revision}-${env.GITHUB_RUN_ID}-${env.GITHUB_RUN_ATTEMPT}-${env.RUNNER_OS}-${process.arch}-${process.version}\n`);
          NODE

      - name: Next output только текущего run/SHA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.next-pack.outputs.name }}
          path: |
            ${{ runner.temp }}/next-output.tar.gz
            ${{ runner.temp }}/next-provenance.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  native-tests:
    needs: [unit-tests, build-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pero_ci
          POSTGRES_USER: ci_runner
          POSTGRES_PASSWORD: ci-only-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data:rw,nosuid,size=512m
          --label pero.ci.repository=navasiolau/pero_crm
          --label pero.ci.run=${{ github.run_id }}
          --label pero.ci.attempt=${{ github.run_attempt }}
          --label pero.ci.service=postgres
          --health-cmd "pg_isready -U ci_runner -d pero_ci"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://ci_runner:ci-only-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:55432/pero_ci?schema=public
      CRM_FILE_STORAGE: s3
      S3_ENDPOINT: http://127.0.0.1:59000
      S3_BUCKET: ci-${{ github.run_id }}-${{ github.run_attempt }}
      S3_ACCESS_KEY: ci_runner
      S3_SECRET_KEY: ci-only-${{ github.run_id }}-${{ github.run_attempt }}-s3
      S3_REGION: us-east-1
      AUTH_SECRET: ci-only-${{ github.run_id }}-${{ github.run_attempt }}-auth
      AUTH_URL: http://127.0.0.1:3100
      AUTH_TRUST_HOST: 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ needs.build-checks.outputs.node-version }}
          cache: pnpm

      - name: Зависимости
        run: pnpm install --frozen-lockfile

      - name: Prisma Client (generate)
        run: pnpm --filter @pero/web exec prisma generate

      - name: Получить Next output этого run
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build-checks.outputs.next-artifact-name }}
          path: ${{ runner.temp }}/pero-ci-next

      - name: Проверить принадлежность Next output до DB/S3 операций
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import path from 'node:path';
          const env = process.env;
          const directory = path.join(env.RUNNER_TEMP, 'pero-ci-next');
          const provenance = JSON.parse(readFileSync(path.join(directory, 'next-provenance.json'), 'utf8'));
          const expected = { repository: env.GITHUB_REPOSITORY, revision: env.GITHUB_SHA,
            runId: env.GITHUB_RUN_ID, attempt: env.GITHUB_RUN_ATTEMPT,
            node: process.version, platform: process.platform, arch: process.arch,
            runnerOS: env.RUNNER_OS, imageOS: env.ImageOS };
          for (const [key, value] of Object.entries(expected)) {
            if (!value || provenance[key] !== value) throw Error(`CI_NEXT_ARTIFACT_REFUSED:${key}`);
          }
          if (execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim() !== env.GITHUB_SHA ||
            !provenance.buildId || provenance.sha256 !== createHash('sha256')
              .update(readFileSync(path.join(directory, 'next-output.tar.gz'))).digest('hex')) {
            throw Error('CI_NEXT_ARTIFACT_REFUSED:content');
          }
          NODE
          tar -xzf "$RUNNER_TEMP/pero-ci-next/next-output.tar.gz" -C apps/web
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import path from 'node:path';
          const provenance = JSON.parse(readFileSync(path.join(process.env.RUNNER_TEMP, 'pero-ci-next/next-provenance.json'), 'utf8'));
          if (readFileSync('apps/web/.next/BUILD_ID', 'utf8').trim() !== provenance.buildId) {
            throw Error('CI_NEXT_ARTIFACT_REFUSED:build-id');
          }
          NODE

      - uses: docker/setup-buildx-action@v3

      - name: Закреплённый source MinIO с отдельным build cache
        id: minio
        uses: docker/build-push-action@v6
        with:
          context: apps/web/tests/integration/runtime
          file: apps/web/tests/integration/runtime/Dockerfile.minio
          platforms: linux/amd64
          load: true
          provenance: false
          cache-from: type=gha,scope=pero-ci-minio
          cache-to: type=gha,mode=max,scope=pero-ci-minio
          tags: pero-ci-${{ github.run_id }}-${{ github.run_attempt }}-minio:source
          labels: |
            pero.ci.repository=navasiolau/pero_crm
            pero.ci.run=${{ github.run_id }}
            pero.ci.attempt=${{ github.run_attempt }}
            pero.ci.service=minio
            pero.ci.minio.commit=07c3a429bfed433e49018cb0f78a52145d4bedeb

      - name: Интеграционные PostgreSQL + HTTP/S3 контракты
        run: pnpm --filter @pero/web test:integration
        env:
          PERO_CI_POSTGRES_ID: ${{ job.services.postgres.id }}
          PERO_CI_NETWORK: ${{ job.services.postgres.network }}
          PERO_CI_MINIO_IMAGE_ID: ${{ steps.minio.outputs.imageid }}

      - name: Удалить временный MinIO и завершить web
        if: always()
        run: node apps/web/tests/integration/runtime/cleanup.mjs
        env:
          PERO_CI_POSTGRES_ID: ${{ job.services.postgres.id }}
          PERO_CI_NETWORK: ${{ job.services.postgres.network }}
          PERO_CI_MINIO_IMAGE_ID: ${{ steps.minio.outputs.imageid }}
        # PostgreSQL и job network удаляет штатный GitHub Stop containers;
        # данные обоих сервисов в tmpfs, постоянные тома не создаются.

  # Итоговый обязательный gate не допускает публикацию при failure/cancelled/skipped.
  test:
    if: always()
    needs: [unit-tests, build-checks, native-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Все обязательные проверки завершились успешно
        run: |
          test "$UNIT_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$NATIVE_RESULT" = success
        env:
          UNIT_RESULT: ${{ needs.unit-tests.result }}
          BUILD_RESULT: ${{ needs.build-checks.result }}
          NATIVE_RESULT: ${{ needs.native-tests.result }}

  build-push:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          cache-from: type=gha,scope=pero-web
          cache-to: type=gha,mode=max,scope=pero-web
          tags: |
            ghcr.io/navasiolau/pero_crm:${{ github.ref_name }}
            ghcr.io/navasiolau/pero_crm:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}

  # Telegram-бот — изолированный сервис (LXC tgbot), свой образ,
  # та же pull-модель деплоя (watcher-крон на контейнере)
  build-push-bot:
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/telegram-bot/Dockerfile
          push: true
          cache-from: type=gha,scope=pero-telegram-bot
          cache-to: type=gha,mode=max,scope=pero-telegram-bot
          tags: |
            ghcr.io/navasiolau/pero_telegram_bot:${{ github.ref_name }}
            ghcr.io/navasiolau/pero_telegram_bot:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
